name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set Default Scheme
        id: set-scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo "default_scheme=$default" >> $GITHUB_OUTPUT
          echo "Using default scheme: $default"

      - name: Build Archive
        run: |
          # Auto-detect .xcodeproj
          project_file=$(ls -A | grep -i \\.xcodeproj\$ | head -1)
          xcodebuild archive \
            -project "$project_file" \
            -scheme "${{ steps.set-scheme.outputs.default_scheme }}" \
            -sdk iphoneos \
            -configuration Release \
            -archivePath Inneal.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R Inneal.xcarchive/Products/Applications/*.app Payload/
          zip -r Inneal.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Inneal-unsigned
          path: Inneal.ipa
